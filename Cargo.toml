[package]
name = "portalis"
version = "0.1.0"
edition = "2021"
description = "Offline, hash-locked package manager with a Nix-style store"
license = "MIT"

[[bin]]
name = "portalis"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
goblin = "0.10.7"
zstd = "0.13"

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
